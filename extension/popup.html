<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace Extractor</title>
  <style>
    body { width: 280px; margin: 0; padding: 20px; font: 14px system-ui, sans-serif; color: #17212d; }
    h1 { font-size: 17px; margin: 0 0 8px; }
    p { line-height: 1.45; margin: 0 0 16px; color: #536171; }
    button { width: 100%; border: 0; border-radius: 7px; padding: 10px; font: inherit; cursor: pointer; }
    #extract { background: #1769d2; color: white; font-weight: 600; }
    #dashboard { margin-bottom: 8px; background: #17212d; color: white; font-weight: 600; }
    #overlay { margin-bottom: 8px; background: #1769d2; color: white; font-weight: 600; }
    #export { margin-top: 8px; background: #edf2f7; color: #17212d; }
    button:disabled { opacity: .55; cursor: default; }
    #count { margin: 14px 0 0; color: #344456; }
    #status { min-height: 20px; margin-top: 10px; font-size: 12px; }
    #status.error { color: #a22121; }
  </style>
</head>
<body>
  <h1>Marketplace Extractor</h1>
  <p>Browse listings in the local dashboard, using your open Marketplace tab as the source. Extract directly here when viewing Marketplace.</p>
  <button id="dashboard">Open Dashboard</button>
  <button id="overlay">Open Full Page View</button>
  <button id="extract">Extract Listings</button>
  <button id="export">Export JSON</button>
  <div id="count">Saved listings: …</div>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
